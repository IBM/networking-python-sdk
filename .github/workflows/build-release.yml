name: Build & Release

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-secrets:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: detect-secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.15

      - name: Install detect-secrets
        run: |
          pip install --upgrade "git+https://github.com/ibm/detect-secrets.git@master#egg=detect-secrets"

      - name: Run detect-secrets
        run: |
          detect-secrets scan --update .secrets.baseline
          detect-secrets -v audit --report --fail-on-unaudited --fail-on-live --fail-on-audited-real .secrets.baseline

  build:
    name: build-test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14', '3.15']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install 'tox<4' tox-gh-actions

      - name: Run tests
        run: tox

      - name: Dry run version bump
        run: |
          CURRENT=$(grep -oE "__version__ = '[^']+'" ibm_cloud_networking_services/version.py | cut -d"'" -f2)
          ./scripts/bump-version.sh --dry-run "$CURRENT" 999.999.999

  create-release:
    name: semantic-release
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Notify Slack - Release Started
        run: |
          jq -n --arg results "Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{sdk: "networking-python-sdk", language: "python", status: "started", actor: "${{ github.actor }}", results: $results}' \
            | curl -X POST "${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}" -H 'Content-Type: application/json' -d @-

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pip install pypandoc

      - name: Install publishing tools
        run: |
          pip install build twine
          npm ci

      - name: Validate version consistency
        id: validate
        run: |
          echo "=== Checking version consistency across files ==="

          # Extract versions from each file
          SETUP_VERSION=$(grep "__version__ = " setup.py | head -1 | cut -d"'" -f2)
          VERSION_PY=$(grep "__version__ = " ibm_cloud_networking_services/version.py | cut -d"'" -f2)
          README_VERSION=$(grep "# IBM Cloud Networking Services Python SDK Version" README.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

          echo "Version in setup.py:   $SETUP_VERSION"
          echo "Version in version.py: $VERSION_PY"
          echo "Version in README.md:  $README_VERSION"

          # Check if all versions match
          if [ "$SETUP_VERSION" != "$VERSION_PY" ] || \
             [ "$SETUP_VERSION" != "$README_VERSION" ]; then
            echo "❌ ERROR: Version mismatch detected!"
            echo "All version strings must match before release."
            exit 1
          fi

          echo "✅ All version strings are consistent: $SETUP_VERSION"

      - name: Run semantic-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release

      - name: Publish to PyPI
        if: success()
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m build
          python -m twine upload dist/*

      - name: Notify Slack - Release Completed
        if: success()
        run: |
          RESULTS=$(printf 'Release : %s\nPyPI    : %s\nRun     : %s' \
            "${{ steps.release.outputs.version || 'No new release published' }}" \
            "https://pypi.org/project/ibm-cloud-networking-services/${{ steps.release.outputs.version }}/" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          jq -n --arg results "$RESULTS" \
            '{sdk: "networking-python-sdk", language: "python", status: "completed", actor: "${{ github.actor }}", results: $results}' \
            | curl -X POST "${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}" -H 'Content-Type: application/json' -d @-

      - name: Notify Slack - Release Failed
        if: failure()
        run: |
          RESULTS=$(printf 'Error : %s\nRun   : %s' \
            "${{ steps.validate.outcome == 'failure' && 'Version validation failed, version strings in setup.py, version.py and README.md do not match' || steps.release.outcome == 'failure' && 'semantic-release failed' || 'Failed before semantic-release' }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          jq -n --arg results "$RESULTS" \
            '{sdk: "networking-python-sdk", language: "python", status: "failed", actor: "${{ github.actor }}", results: $results}' \
            | curl -X POST "${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}" -H 'Content-Type: application/json' -d @-
